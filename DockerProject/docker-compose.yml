version: '3.8'
services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      # 公開フォルダ（ブラウザから見えるのは htdocs の中だけ）
      - ./htdocs:/var/www/html
      # 共通処理（DB接続など）。公開フォルダの外に置き、ブラウザから直接見えないようにする
      - ./lib:/var/www/lib
    depends_on:
      - mysql
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci # ← 追加
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: soshage_db
    ports:
      - "3307:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: